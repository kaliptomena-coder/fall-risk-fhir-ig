id: hl7.fhir.uv.fall-risk
canonical: https://example.org/fhir/fall-risk
name: FallRiskAssessmentIG
title: "Fall Risk Assessment Implementation Guide"
description: "Interoperable FHIR-based fall risk assessment for older adults using standardized scoring, objective performance tests, and EHR-derived data."
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2025+
releaseLabel: ci-build
license: CC0-1.0
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World"

publisher:
  name: Fall Risk IG Authors
  url: https://example.org/fall-risk
  email: info@example.org



pages:
  index.md:
    title: Home
  examples.md:
    title: Examples

menu:
  Home: index.html
  Examples: examples.html
  Artifacts: artifacts.html

parameters:
  show-inherited-invariants: false
  path-resource:
    - input/examples
  path-pages:
    - input/pagecontent

artifacts:
  groups:
    - name: "Example Scenario Resources"
      description: "Resources representing the complete assessment for Maria Müller."
      resources:
        - Patient/example-patient
        - Practitioner/example-practitioner
        - QuestionnaireResponse/qr-falls-history
        - Observation/obs-falls-history
        - Observation/obs-fear-of-falling
        - Observation/obs-adl
        - Observation/obs-walking
        - Observation/obs-tug-test
        - Observation/obs-chair-stand
        - Observation/obs-balance
        - Observation/obs-fall-risk-score
        - Observation/obs-fall-risk-result
        - Condition/condition-fall-risk

FSHOnly: false
applyExtensionMetadataToRoot: false
instanceOptions:
  setMetaProfile: always
  setId: always
  manualSliceOrdering: false
